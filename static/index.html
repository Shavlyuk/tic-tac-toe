<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Крестики-нолики</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h1 { color: #333; margin-bottom: 1.5rem; font-size: 2.5rem; }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            grid-gap: 5px;
            margin: 1.5rem auto;
            justify-content: center;
        }
        .cell {
            width: 80px;
            height: 80px;
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .cell:hover { background: #e9ecef; transform: scale(1.05); }
        .cell.x { color: #dc3545; }
        .cell.o { color: #007bff; }
        input {
            padding: 0.8rem;
            margin: 0.5rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            width: 200px;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            margin: 0.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }
        button:hover { background: #5a6fd8; }
        .game-info { margin: 1rem 0; padding: 1rem; background: #f8f9fa; border-radius: 8px; }
        .status { font-size: 1.2rem; font-weight: bold; margin: 1rem 0; }
        .winner { color: #28a745; font-size: 1.5rem; margin: 1rem 0; }
        .player-info { display: flex; justify-content: space-around; margin: 1rem 0; }
        .player.current { background: #007bff; color: white; padding: 0.5rem 1rem; border-radius: 5px; }
        .hidden { display: none; }

    .cell.disabled {
        cursor: not-allowed !important;
        opacity: 0.6;
        background: #e9ecef !important;
    }

    .cell.disabled:hover {
        transform: none !important;
        background: #e9ecef !important;
    }

    .player.current {
        background: #007bff;
        color: white;
    }

    .player.your-turn {
        background: #28a745 !important;
        color: white;
        animation: pulse 2s infinite;
    }

    .player.waiting-turn {
        background: #6c757d;
        color: white;
        opacity: 0.8;
    }

    .your-turn {
        color: #28a745;
        font-weight: bold;
    }

    .waiting-turn {
        color: #6c757d;
        font-style: italic;
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
    }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Крестики-нолики</h1>

        <div id="setupScreen">
            <div>
                <input type="text" id="playerName" placeholder="Ваше имя" maxlength="20">
                <button onclick="createGame()">Создать игру</button>
            </div>
            <div style="margin-top: 1rem;">
                <input type="text" id="gameIdInput" placeholder="ID игры для присоединения">
                <button onclick="joinGame()">Присоединиться</button>
            </div>
        </div>

        <div id="gameScreen" class="hidden">
            <div class="game-info">
                <div>ID игры: <span id="gameId"></span></div>
                <div class="status" id="gameStatus">Ожидание игроков...</div>

                <div class="player-info">
                    <div class="player" id="playerX">X: Ожидание...</div>
                    <div class="player" id="playerO">O: Ожидание...</div>
                </div>
            </div>

            <div class="board" id="gameBoard"></div>

            <button onclick="resetGame()">Новая игра</button>
            <button onclick="leaveGame()">Выйти</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
